name: DSH Code Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: dsh-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  review:
    name: DSH code review
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # pull_request_target provides secrets. The base revision is checked out
      # for the trusted workflow scripts only; the PR head is checked out as
      # inert review data for the model's read-only tools — nothing from it is
      # ever installed, built, or executed.
      - name: Check out trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out untrusted PR head (review data only)
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr-head
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare isolated DSH directories
        run: |
          set -euo pipefail
          {
            echo "DSH_HOME=$RUNNER_TEMP/dsh-review-home"
            echo "DSH_REVIEW_CONTEXT=$RUNNER_TEMP/dsh-review-context.md"
            echo "DSH_REVIEW_OUTPUT=$RUNNER_TEMP/dsh-review-output.json"
            echo "DSH_REVIEW_STDERR=$RUNNER_TEMP/dsh-review-stderr.log"
          } >> "$GITHUB_ENV"

      - name: Verify review credentials
        env:
          DSH_INTEGRATION_BASE_URL: ${{ secrets.DSH_INTEGRATION_BASE_URL }}
          DSH_INTEGRATION_API_KEY: ${{ secrets.DSH_INTEGRATION_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DSH_INTEGRATION_BASE_URL" || { echo '::error::DSH_INTEGRATION_BASE_URL is not configured'; exit 1; }
          test -n "$DSH_INTEGRATION_API_KEY" || { echo '::error::DSH_INTEGRATION_API_KEY is not configured'; exit 1; }

      - name: Install DSH (pinned)
        run: |
          npm install --global @deepseek-ai/dsh@0.1.2-rc.1
          dsh --version

      - name: Prepare untrusted PR data for review
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-dsh-review.mjs`);
            const { prepareDshReview } = await import(scriptUrl.href);
            await prepareDshReview({ github, context, core, contextPath: process.env.DSH_REVIEW_CONTEXT });

      - name: Materialize the PR diff for the review agent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A PR could ship .dsh-review (or diff.patch) as a symlink; never
          # write through it as the runner user.
          test ! -L pr-head/.dsh-review
          test ! -L pr-head/.dsh-review/diff.patch
          mkdir -p pr-head/.dsh-review
          # base.sha can sit ahead of the head's history (a fork branched
          # before the base tip), so fetch it explicitly — GitHub allows
          # fetching reachable SHAs. Full depth: a shallow base has its parent
          # links cut, and `A...B` then finds no merge base.
          git -C pr-head fetch --quiet origin "$BASE_SHA"
          git -C pr-head diff "$BASE_SHA...HEAD" > pr-head/.dsh-review/diff.patch
          test -s pr-head/.dsh-review/diff.patch || echo '(empty diff)' > pr-head/.dsh-review/diff.patch

      # The model process must never hold a secret: dsh runs as `nobody` with a
      # scrubbed env, and the loopback proxy (runner user) injects the gateway
      # key. tool-fs read is ungated in dsh 0.1.2-rc.1, so Unix permissions are the
      # real boundary: `nobody` cannot read the proxy's /proc environ or the
      # runner's credentials, and cannot write outside its own DSH_HOME — which
      # also backstops the write ops inside tool-fs.
      - name: Run DSH code review
        env:
          DSH_INTEGRATION_BASE_URL: ${{ secrets.DSH_INTEGRATION_BASE_URL }}
          DSH_INTEGRATION_API_KEY: ${{ secrets.DSH_INTEGRATION_API_KEY }}
        run: |
          set -euo pipefail
          node .github/scripts/review-gateway-proxy.mjs > "$RUNNER_TEMP/review-proxy-port" &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do [ -s "$RUNNER_TEMP/review-proxy-port" ] && break; sleep 0.1; done
          port="$(cat "$RUNNER_TEMP/review-proxy-port")"
          test -n "$port"
          chmod 755 "$RUNNER_TEMP"
          # nobody must TRAVERSE the directory chain down to the checkout
          # (inert review data) and its own DSH_HOME — the runner's parents
          # are not world-searchable by default. o+x grants search without
          # directory listing, so the containment boundary is unchanged.
          chmod o+x /home/runner /home/runner/work "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE"
          sudo -n install -d -o nobody -g nogroup "$DSH_HOME"
          cd pr-head
          # Redirects are evaluated by the runner shell on purpose: the report
          # and stderr files must stay owned by the runner user, not `nobody`.
          # shellcheck disable=SC2024
          if ! sudo -n -u nobody env \
            HOME="$DSH_HOME" \
            PATH="$PATH" \
            DSH_HOME="$DSH_HOME" \
            DSH_REVIEW_CONTEXT="$DSH_REVIEW_CONTEXT" \
            DSH_REVIEW_GATEWAY_URL="http://127.0.0.1:${port}" \
            DSH_REVIEW_API_KEY=via-loopback-proxy \
            DSH_PERMISSION_MODE=read-only \
            DSH_TELEMETRY_DISABLED=1 \
            "$(command -v dsh)" \
            --profile headless \
            --patch "$GITHUB_WORKSPACE/.github/dsh-review/model.patch.yml" \
            'Run the trusted code review task.' \
            > "$DSH_REVIEW_OUTPUT" \
            2> "$DSH_REVIEW_STDERR"; then
            echo '::error::DSH code review failed'
            tail -n 200 "$DSH_REVIEW_STDERR"
            exit 1
          fi
          test -s "$DSH_REVIEW_OUTPUT" || { echo '::error::DSH review returned no output'; exit 1; }

      - name: Publish review comment
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-dsh-review.mjs`);
            const { publishDshReview } = await import(scriptUrl.href);
            await publishDshReview({ github, context, core, reviewPath: process.env.DSH_REVIEW_OUTPUT });

      - name: Upload DSH review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsh-review-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/dsh-review-output.json
            ${{ runner.temp }}/dsh-review-stderr.log
