name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub-hosted runners: public repo, unlimited minutes. `pull_request` from
# forks receives no secrets, so lint/build/test run for fork PRs too.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the packageManager field in package.json —
      # do not set it here too (pnpm/action-setup errors on duplicates).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint

      # Workflow files are parsed by GitHub only at run time — a schema or
      # context error kills the workflow with zero job logs (we shipped
      # `${{ runner.temp }}` in a job-level `env:` once and the E2E never
      # triggered). Lint them like code.
      - name: Lint workflow files (actionlint, pinned)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint .github/workflows/*.yml

  build:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
